<div class="mahout-fields-control mahout-fields-control--choice" data-field="fixture_field">
	<label for="mahout-field-fixture_field">Fixture label</label>
	<select
		id="mahout-field-fixture_field"
		name="mahout_fields_panel[fixture_group][fixture_field]"
		required="required" aria-required="true" 				aria-invalid="true" aria-describedby="mahout-field-fixture_field-error" >
				<option value=""></option>
					<option value="planned">planned</option>
			<option value="ongoing">ongoing</option>
			<option value="done">done</option>
		</select>
			<p class="mahout-fields-error" id="mahout-field-fixture_field-error">That value was refused.</p>
	</div>
